<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anime List">
</head>
<body>
<title>Anime List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Concept: "dusk broadcast". A night-sky ground lit by a sunset gradient (coral, rose, violet), as in late-evening anime skies.
   Glass panels float over a slowly drifting aurora and a faint starfield. One gradient, one display face, used with restraint.
   Layout: sticky glass bar · hero (headline, live counters, orbit illustration) · continue-watching rail · search · views. */
:root{
  --bg:#0b0e14; --bg2:#0f141d; --surface:#121823; --glass:rgba(255,255,255,.025); --glass-2:rgba(255,255,255,.05);
  --sunken:rgba(255,255,255,.04); --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
  --ink:#e8ebf1; --muted:#8e97a8; --faint:#5f6879;
  --c1:#3b7cf0; --c2:#4a88f2; --c3:#7ea8f5;
  --grad:linear-gradient(180deg, var(--c2), var(--c1));
  --accent:#6f9ef5; --accent-ink:#ffffff; --accent-soft:rgba(74,136,242,.12);
  --good:#5cc8b0; --good-soft:rgba(92,200,176,.13); --warn:#d9b26a; --warn-soft:rgba(217,178,106,.13);
  --danger:#e8727c; --star:#f2c86b;
  --shadow:0 10px 30px rgba(0,0,0,.35); --glow:0 0 0 1px rgba(255,255,255,.05), 0 14px 36px rgba(0,0,0,.4);
  --stars:0; --blob:.12;
  --r:14px; --r-lg:20px; --r-xl:28px;
  --f-display:"Plus Jakarta Sans", system-ui, sans-serif;
  --f-ui:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-jp:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5f6f8; --bg2:#eceff4; --surface:#ffffff; --glass:#ffffff; --glass-2:#f7f8fa;
  --sunken:rgba(18,23,48,.05); --line:rgba(18,23,48,.08); --line-strong:rgba(18,23,48,.17);
  --ink:#121730; --muted:#5a627d; --faint:#8b93ac;
  --c1:#2563eb; --c2:#2f6fed; --c3:#5b8ff0;
  --accent:#1f5fd8; --accent-ink:#ffffff; --accent-soft:rgba(37,99,235,.1);
  --good:#13866f; --good-soft:rgba(19,134,111,.1); --warn:#9a6d12; --warn-soft:rgba(154,109,18,.1); --danger:#c8404b; --star:#d99a00;
  --shadow:0 12px 34px rgba(30,40,80,.12); --glow:0 0 0 1px rgba(18,23,48,.04), 0 18px 50px rgba(37,99,235,.16);
  --stars:0; --blob:.08; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f5f6f8; --bg2:#eceff4; --surface:#ffffff; --glass:#ffffff; --glass-2:#f7f8fa;
  --sunken:rgba(18,23,48,.05); --line:rgba(18,23,48,.08); --line-strong:rgba(18,23,48,.17);
  --ink:#121730; --muted:#5a627d; --faint:#8b93ac;
  --c1:#2563eb; --c2:#2f6fed; --c3:#5b8ff0;
  --accent:#1f5fd8; --accent-ink:#ffffff; --accent-soft:rgba(37,99,235,.1);
  --good:#13866f; --good-soft:rgba(19,134,111,.1); --warn:#9a6d12; --warn-soft:rgba(154,109,18,.1); --danger:#c8404b; --star:#d99a00;
  --shadow:0 12px 34px rgba(30,40,80,.12); --glow:0 0 0 1px rgba(18,23,48,.04), 0 18px 50px rgba(37,99,235,.16);
  --stars:0; --blob:.08; color-scheme:light }

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c2); outline-offset:2px}
svg{display:block}
.wrap{max-width:1080px; margin:0 auto; padding-inline:20px}
::selection{background:var(--accent-soft)}

/* ---------- living sky ---------- */
.sky{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; background:radial-gradient(120% 80% at 50% -10%, var(--bg2), var(--bg) 60%)}
.sky canvas{position:absolute; inset:0; width:100%; height:100%; opacity:var(--stars)}
.blob{position:absolute; width:46vmax; height:46vmax; border-radius:50%; filter:blur(70px); opacity:var(--blob); will-change:transform}
.b1{background:var(--c1); top:-22vmax; left:-10vmax; animation:drift1 26s ease-in-out infinite alternate}
.b2{background:var(--c2); top:-18vmax; right:-14vmax; animation:drift2 32s ease-in-out infinite alternate}
.b3{background:var(--c3); top:40vh; left:45vw; width:30vmax; height:30vmax; opacity:calc(var(--blob) * .4); animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(12vw,8vh,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-10vw,14vh,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(-18vw,-10vh,0) scale(1.2)}}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  background:color-mix(in srgb, var(--bg) 62%, transparent); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:16px; height:64px}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:19px; letter-spacing:-.02em; white-space:nowrap}
.logo svg{flex:none}
.nav{display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--glass); border:1px solid var(--line); margin-left:auto; position:relative}
.nav-btn{position:relative; z-index:1; border:0; background:none; border-radius:999px; padding:8px 16px; font-weight:700; font-size:14px; color:var(--muted); display:flex; gap:8px; align-items:center; transition:color .25s var(--ease)}
.nav-btn svg{width:17px; height:17px}
.nav-btn:hover{color:var(--ink)}
.nav-btn[aria-current="page"]{color:#fff}
.nav-pill{position:absolute; z-index:0; top:4px; bottom:4px; border-radius:999px; background:var(--grad); box-shadow:0 6px 18px rgba(37,99,235,.38); transition:left .45s var(--ease), width .45s var(--ease)}
.badge{background:#fff; color:#1d4ed8; font-size:11px; font-weight:800; border-radius:999px; padding:0 7px; line-height:18px; font-variant-numeric:tabular-nums}
.nav-btn:not([aria-current="page"]) .badge{background:var(--c2); color:#fff}
.gear{width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--glass); color:var(--muted); display:grid; place-items:center; flex:none; transition:transform .5s var(--ease), color .2s}
.gear:hover{color:var(--ink); transform:rotate(60deg)}

/* ---------- hero ---------- */
.hero{padding-block:44px 8px}
.hero-grid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); gap:28px; align-items:center}
.eyebrow{display:inline-flex; align-items:center; gap:10px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.eyebrow .jp{font-family:var(--f-jp); letter-spacing:.08em; text-transform:none; font-size:13px; color:var(--ink); padding:3px 10px; border-radius:999px; background:var(--glass); border:1px solid var(--line)}
.eyebrow .live{width:8px; height:8px; border-radius:50%; background:var(--c2); box-shadow:0 0 0 0 var(--c2); animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}70%{box-shadow:0 0 0 10px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
h1{margin:14px 0 0; font-family:var(--f-display); font-weight:800; font-size:clamp(40px, 6.4vw, 76px); line-height:.95; letter-spacing:-.04em; text-wrap:balance}
h1 .g{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200% 100%; animation:sheen 8s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
.sub{margin:16px 0 0; color:var(--muted); font-size:16px; max-width:52ch}
.stats{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px}
.stat{position:relative; padding:12px 18px 12px 16px; border-radius:var(--r); background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px); min-width:118px; overflow:hidden}
.stat::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--grad)}
.stat b{display:block; font-family:var(--f-display); font-size:28px; font-weight:800; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}
.orbit{position:relative; aspect-ratio:1; width:100%; max-width:340px; justify-self:center; perspective:900px}
.orbit svg{width:100%; height:100%; overflow:visible; transform-style:preserve-3d; transition:transform .6s var(--ease)}
.spin{transform-origin:200px 200px; animation:spin 40s linear infinite}
.spin.rev{animation-duration:60s; animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px)}}

/* ---------- continue rail ---------- */
.rail-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:30px 0 12px}
.rail-head h2{margin:0; font-family:var(--f-display); font-size:22px; font-weight:800; letter-spacing:-.02em}
.rail-head p{margin:0; font-size:13px; color:var(--faint)}
.rail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 280px); gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding:6px 2px 18px; scrollbar-width:thin; perspective:1000px}
.tilt{scroll-snap-align:start; position:relative; border-radius:var(--r-lg); padding:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px);
  transform-style:preserve-3d; transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s; display:flex; flex-direction:column; gap:12px; min-width:0}
.tilt:hover{box-shadow:var(--glow); border-color:var(--line-strong)}
.tilt::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.10), transparent 60%); opacity:0; transition:opacity .3s}
.tilt:hover::after{opacity:1}
.tilt-top{display:flex; gap:12px; align-items:center}
.ring{flex:none; width:58px; height:58px; position:relative}
.ring svg{width:58px; height:58px; transform:rotate(-90deg)}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-num); font-size:12px; font-weight:600}
.ring circle{transition:stroke-dashoffset .8s var(--ease)}
.tilt .nm{font-weight:800; font-size:15px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tilt .sm2{font-size:12.5px; color:var(--muted)}
.tilt .next{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
.tilt .next b{color:var(--ink); font-weight:700}
.tilt-acts{display:flex; gap:8px; align-items:center; margin-top:auto}
.rail-empty{padding:22px; border-radius:var(--r-lg); border:1px dashed var(--line-strong); color:var(--muted)}

/* ---------- search ---------- */
main.wrap{padding-block:12px 140px; display:flex; flex-direction:column; gap:16px}
.add{position:relative; z-index:30; isolation:isolate; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--glass-2); border:1px solid var(--line); border-radius:var(--r-xl); padding:8px; box-shadow:var(--shadow); backdrop-filter:blur(16px); transition:box-shadow .3s, border-color .3s}
.add:focus-within{border-color:rgba(124,192,255,.25); box-shadow:var(--glow)}
/* a comet of light that circles the search bar while you type */
@property --ang{syntax:'<angle>'; inherits:false; initial-value:0deg}
.add::before{content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1.5px; pointer-events:none;
  background:conic-gradient(from var(--ang), transparent 0 62%, var(--c1) 76%, var(--c3) 88%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0; transition:opacity .35s; animation:ang 3.6s linear infinite}
.add:focus-within::before{opacity:1}
@keyframes ang{to{--ang:360deg}}
.add .grow{flex:1 1 240px; display:flex; align-items:center; gap:12px; padding-left:14px; min-width:0}
.add .grow svg{color:var(--faint); flex:none}
.bare{border:0; background:transparent; padding:10px 0; width:100%; min-width:0; outline:none; font-size:16px}
.bare::placeholder{color:var(--faint)}
.add:not(.manual) .mini{display:none}
.kb{font-family:var(--f-num); font-size:11px; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:1px 6px; flex:none}
.mini{width:100px; border:1px solid var(--line); background:var(--sunken); border-radius:999px; padding:8px 12px}
.mini:focus{outline:2px solid var(--c2); outline-offset:-1px}
.sugg{position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:35; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:0 24px 60px rgba(0,0,0,.4); padding:6px; max-height:min(70vh,560px); overflow:auto; animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0; transform:translateY(-6px) scale(.985)}}
.sg-head{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); padding:10px 12px 4px}
.sg{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; cursor:pointer; transition:background .15s}
.sg:hover,.sg.on{background:var(--sunken)}
.sg .ic{width:34px; height:34px; border-radius:11px; background:var(--sunken); color:var(--faint); display:grid; place-items:center; flex:none}
.sg.on .ic,.sg:hover .ic{background:var(--grad); color:#fff}
.sg .tx{min-width:0; flex:1}
.sg .t{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sg .t mark{background:none; color:var(--accent); font-weight:800}
.sg .m{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sg .in{font-size:11.5px; font-weight:800; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 10px; white-space:nowrap}
.sg-foot{font-size:12.5px; color:var(--faint); padding:9px 12px 6px; border-top:1px solid var(--line); margin-top:4px}
.sg-foot b{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-strong); background:var(--glass); padding:9px 18px; border-radius:999px; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; transition:transform .15s var(--ease), border-color .2s, background .2s, box-shadow .2s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 8px 22px rgba(37,99,235,.35)}
.btn.primary:hover{box-shadow:0 10px 28px rgba(37,99,235,.5); filter:saturate(1.1)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--ink); background:var(--sunken)}
.btn.sm{padding:6px 13px; font-size:13px}
.btn:disabled{opacity:.45; cursor:default}

/* ---------- list views ---------- */
.view{display:flex; flex-direction:column; gap:14px}
.view[hidden]{display:none}
.view.entered{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0; transform:translateY(10px)}}
.tabs{display:flex; flex-wrap:wrap; gap:6px}
.tab{border:1px solid var(--line); background:var(--glass); border-radius:999px; padding:8px 15px; font-weight:700; font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px; white-space:nowrap; transition:all .25s var(--ease)}
.tab:hover{color:var(--ink); border-color:var(--line-strong)}
.tab[aria-selected="true"]{color:var(--ink); background:var(--glass-2); border-color:transparent; box-shadow:0 0 0 1.5px var(--c2) inset}
.tab .n{font-family:var(--f-num); font-size:12px; color:var(--faint)}
.tab[aria-selected="true"] .n{color:var(--accent)}
.tab .dotc{width:8px; height:8px; border-radius:50%}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.selall{display:flex; align-items:center; gap:10px; padding-left:14px; color:var(--muted); font-size:14px; margin-right:auto}
.search{display:flex; align-items:center; gap:8px; background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:0 14px; flex:0 1 240px; min-width:0}
.search:focus-within{border-color:var(--c2)}
.search svg{color:var(--faint); flex:none}
.search .bare{font-size:14px; padding:8px 0}
.search kbd{font-family:var(--f-num); font-size:11px; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:0 5px}
select.sort{border:1px solid var(--line); background:var(--glass); border-radius:999px; padding:8px 12px; color:var(--ink)}
select.sort option{background:var(--surface)}
.also{font-size:14px; color:var(--muted); padding-left:14px}
.also button{border:0; background:none; color:var(--accent); font-weight:700; padding:0}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.filters button{border:1px solid var(--line); background:transparent; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; color:var(--muted); display:inline-flex; gap:6px; align-items:center; transition:all .2s}
.filters button:hover{color:var(--ink); border-color:var(--line-strong)}
.filters button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.filters button span{font-variant-numeric:tabular-nums; opacity:.7}

.check{appearance:none; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong); background:transparent; margin:0; cursor:pointer; display:grid; place-items:center; flex:none; transition:opacity .15s, background .2s}
.check:checked,.check:indeterminate{background:var(--grad); border-color:transparent}
.check:checked::after{content:""; width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg)}
.check:indeterminate::after{content:""; width:8px; height:2px; background:#fff}

.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.row{position:relative; display:grid; grid-template-columns:20px minmax(0,1fr) auto 36px; grid-template-areas:"pick info ctl more"; align-items:center; gap:14px;
  padding:14px 12px 14px 16px; background:var(--glass); border:1px solid var(--line); border-radius:var(--r-lg); backdrop-filter:blur(12px);
  transition:transform .3s var(--ease), border-color .25s, box-shadow .3s var(--ease)}
.row::before{content:""; position:absolute; left:-1px; top:18%; bottom:18%; width:3px; border-radius:3px; background:var(--grad); opacity:0; transform:scaleY(.4); transition:all .35s var(--ease)}
.row:hover{border-color:var(--line-strong); transform:translateY(-1px); box-shadow:var(--shadow)}
.row:hover::before,.row.sel::before{opacity:1; transform:none}
.row.sel{border-color:var(--c2); box-shadow:0 0 0 3px var(--accent-soft)}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--c2)}100%{box-shadow:0 0 0 0 transparent}}
.list.enter .row{animation:rise .5s var(--ease) both; animation-delay:calc(var(--i, 0) * 28ms)}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}
.row .check{grid-area:pick; opacity:0}
.row:hover .check,.row .check:checked,.row .check:focus-visible,.selecting .row .check{opacity:1}
@media (hover:none){ .row .check{opacity:1} }
.info{grid-area:info; min-width:0; display:flex; flex-direction:column; gap:3px}
.title{border:1px solid transparent; background:transparent; padding:2px 8px; margin-left:-9px; font-size:16px; font-weight:800; letter-spacing:-.01em; width:100%; min-width:0; text-overflow:ellipsis; border-radius:8px}
.title:hover{background:var(--sunken)}
.title:focus{border-color:var(--c2); background:var(--surface); outline:none}
.meta{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0}
.meta .dot{width:3px; height:3px; border-radius:50%; background:var(--faint)}
.meta .ok{color:var(--good); font-weight:700}
.meta .paused{color:var(--warn); font-weight:700}
.meta .dropped{color:var(--danger); font-weight:700}
.genres-line{font-size:12px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.01em}
.note-line{font-size:13px; color:var(--muted); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pbar{height:5px; border-radius:5px; background:var(--sunken); overflow:hidden; max-width:300px; margin-top:4px}
.pbar i{position:relative; display:block; height:100%; border-radius:5px; background:var(--grad); transition:width .6s var(--ease); overflow:hidden}
.pbar i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform:translateX(-100%); animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
/* soft light under the pointer on each card */
.row::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(124,192,255,.08), transparent 55%); opacity:0; transition:opacity .3s}
.row:hover::after{opacity:1}
/* headline words rise in on load */
.rise-w{display:inline-block; animation:wordUp .9s var(--ease) both}
.rise-w:nth-child(2){animation-delay:.08s} .rise-w:nth-child(3){animation-delay:.16s}
@keyframes wordUp{from{opacity:0; transform:translateY(.5em) rotate(2deg); filter:blur(6px)}}
.pbar.full i{background:var(--good)}
.ctl{grid-area:ctl; display:flex; align-items:center; gap:8px; justify-content:flex-end}
.chip{display:flex; align-items:center; gap:2px; background:var(--sunken); border:1px solid var(--line); border-radius:999px; padding:0 4px 0 11px; height:36px; font-size:12px; font-weight:800; color:var(--muted)}
.chip input{width:3.2ch; border:0; background:transparent; text-align:center; font-family:var(--f-num); font-size:14px; color:var(--ink); padding:0}
.chip input:focus{outline:none}
.chip:focus-within{border-color:var(--c2)}
.chip .unit{font-weight:600; padding-right:9px}
.stepper{display:flex; align-items:center; background:var(--sunken); border:1px solid var(--line); border-radius:999px; height:36px; padding:2px}
.stepper:focus-within{border-color:var(--c2)}
.stepper button{width:31px; height:30px; border:0; border-radius:999px; background:transparent; color:var(--muted); display:grid; place-items:center; transition:transform .15s var(--ease), background .2s}
.stepper button:hover{background:var(--glass-2); color:var(--ink)}
.stepper button.plus{background:var(--grad); color:#fff; box-shadow:0 4px 12px rgba(37,99,235,.38)}
.stepper button.plus:active,.bump{animation:bump .35s var(--ease)}
@keyframes bump{40%{transform:scale(1.25)}}
.stepper .ep{display:flex; align-items:center; gap:1px; font-size:12px; font-weight:800; color:var(--muted); padding:0 6px}
.stepper input{width:4.4ch; border:0; background:transparent; text-align:center; font-family:var(--f-num); font-size:14px; color:var(--ink); padding:0}
.stepper input.tot{width:4ch; color:var(--muted)}
.stepper input:focus{outline:none; color:var(--accent)}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
input[type=number]{-moz-appearance:textfield}
.round{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--glass); display:grid; place-items:center; color:var(--muted); flex:none; transition:all .2s}
.round:hover{color:var(--good); border-color:var(--good)}
.round.ready{background:var(--good); border-color:var(--good); color:#fff; box-shadow:0 0 0 5px var(--good-soft); animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 9px var(--good-soft)}}
.more{grid-area:more; width:36px; height:36px; border-radius:50%; border:0; background:transparent; color:var(--faint); display:grid; place-items:center; transition:background .2s}
.more:hover,.more[aria-expanded="true"]{background:var(--sunken); color:var(--ink)}
.stars{display:flex; gap:1px}
.stars button{border:0; background:none; padding:3px; color:var(--line-strong); transition:transform .15s var(--ease), color .15s}
.stars button.on{color:var(--star)}
.stars button:hover{transform:scale(1.2)}
.stars:hover button{color:var(--star)}
.stars button:hover ~ button{color:var(--line-strong)}
.np{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; max-width:100%}
.np::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.np-airing{background:var(--good-soft); color:var(--good)}
.np-airing::before{animation:live 2s infinite}
.np-soon{background:var(--accent-soft); color:var(--accent)}
.np-out,.np-warn{background:var(--warn-soft); color:var(--warn)}
.np-none,.np-done{background:var(--sunken); color:var(--muted)}
.np-done::before{width:8px; height:4px; border-radius:0; background:none; border:solid currentColor; border-width:0 0 2px 2px; transform:translateY(-1px) rotate(-45deg)}
.info .np{align-self:flex-start; margin-top:6px}
.empty{background:var(--glass); border:1px dashed var(--line-strong); border-radius:var(--r-lg); padding:42px 20px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--ink); font-size:17px; margin-bottom:4px; font-family:var(--f-display)}
.note{color:var(--faint); font-size:13px; margin:0; text-align:center}
body.compact .row{padding:8px 10px 8px 14px; gap:10px}
body.compact .genres-line, body.compact .note-line{display:none}
body.compact .title{font-size:15px}
body.nostars .stars{display:none}

/* ---------- sections: week, updates, stats ---------- */
.sec-head{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px}
.sec-head h2{margin:0; font-family:var(--f-display); font-size:26px; font-weight:800; letter-spacing:-.03em}
.sec-head p{margin:0; color:var(--muted); font-size:13px}
.card{background:var(--glass); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; backdrop-filter:blur(12px)}
.day{display:flex; flex-direction:column; gap:6px}
.day h3{margin:10px 0 2px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; gap:8px; align-items:center}
.day h3 .today{color:#fff; background:var(--grad); border-radius:999px; padding:2px 10px; letter-spacing:.04em}
.air{display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 14px; background:var(--glass); border:1px solid var(--line); border-radius:14px; transition:transform .25s var(--ease), border-color .2s}
.air:hover{transform:translateX(3px); border-color:var(--line-strong)}
.air.mine{border-color:transparent; background:linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box; border:1px solid transparent}
.air.past{opacity:.5}
.air .tm{font-family:var(--f-num); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.air .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.air .sm2{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.air .new{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--good); background:var(--good-soft); border-radius:999px; padding:1px 8px}
.in{font-size:11.5px; font-weight:800; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:4px 10px; white-space:nowrap}
.upd{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:15px 18px; background:var(--glass); border:1px solid var(--line); border-radius:var(--r-lg); transition:transform .25s var(--ease), box-shadow .3s}
.upd:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
.upd .nm{font-weight:800; font-size:16px}
.upd .sm2{font-size:13px; color:var(--muted); margin-top:4px}
.upd .acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.upd.seen{opacity:.6}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px}
.tiles .stat{min-width:0}
.bars{display:flex; flex-direction:column; gap:9px}
.bar{display:grid; grid-template-columns:120px minmax(0,1fr) 44px; gap:10px; align-items:center; font-size:14px}
.bar .lb{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .tr{height:12px; background:var(--sunken); border-radius:6px; overflow:hidden}
.bar .tr i{display:block; height:100%; background:var(--grad); border-radius:0 4px 4px 0; transform-origin:left; animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bar .vl{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
.cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(290px, 1fr)); gap:14px}

/* ---------- menu, dock, sheets ---------- */
.menu{position:absolute; z-index:50; min-width:220px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 44px rgba(0,0,0,.35); padding:6px; animation:pop .18s var(--ease)}
.menu button,.menu a{display:flex; width:100%; align-items:center; gap:10px; border:0; background:none; padding:9px 12px; border-radius:10px; text-align:left; color:inherit; text-decoration:none; font-size:14px}
.menu button:hover,.menu button:focus-visible,.menu a:hover{background:var(--sunken); outline:none}
.menu button.danger{color:var(--danger)}
.menu hr{border:0; border-top:1px solid var(--line); margin:4px 6px}
.menu .mh{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding:8px 12px 2px}
.dock{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:45; display:flex; flex-direction:column; align-items:center; gap:8px; width:max-content; max-width:calc(100% - 32px)}
.bulk{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line-strong); border-radius:999px; padding:6px 6px 6px 18px; box-shadow:0 18px 44px rgba(0,0,0,.4); animation:pop .25s var(--ease)}
.bulk .count{font-weight:800; margin-right:6px}
.bulk .btn{background:transparent; border-color:transparent; padding:7px 12px; font-size:13.5px}
.bulk .btn:hover{background:var(--sunken)}
.bulk .btn.del{color:var(--danger)}
.toast{display:flex; align-items:center; gap:12px; background:var(--ink); color:var(--bg); border-radius:999px; padding:9px 9px 9px 18px; font-size:14px; font-weight:600; box-shadow:0 18px 44px rgba(0,0,0,.35); animation:pop .25s var(--ease)}
.toast button{border:0; background:var(--grad); color:#fff; border-radius:999px; padding:5px 13px; font-weight:800}
.toast:not(:has(button)){padding-right:18px}
.sheet-wrap{position:fixed; inset:0; z-index:60; background:rgba(5,8,18,.55); backdrop-filter:blur(6px); display:grid; place-items:center; padding:16px; animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl); width:min(660px,100%); max-height:calc(100vh - 32px); overflow:auto; padding:26px; display:flex; flex-direction:column; gap:16px; box-shadow:0 30px 80px rgba(0,0,0,.45); animation:sheetIn .35s var(--ease)}
.sheet::before{content:""; position:absolute; left:0; right:0; top:0; height:4px; background:var(--grad); border-radius:var(--r-xl) var(--r-xl) 0 0}
@keyframes sheetIn{from{opacity:0; transform:translateY(18px) scale(.98)}}
.sh-top{display:flex; gap:12px; align-items:flex-start}
.sh-top h2{margin:0; font-family:var(--f-display); font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1.1; text-wrap:balance}
.sh-top .alt{margin:5px 0 0; color:var(--muted); font-size:14px}
.sh-top .x{margin-left:auto; flex:none; width:38px; height:38px; border-radius:50%; border:0; background:var(--sunken); color:var(--muted); font-size:17px; transition:transform .3s var(--ease)}
.sh-top .x:hover{transform:rotate(90deg); color:var(--ink)}
.facts{display:flex; flex-wrap:wrap; gap:8px}
.fact{background:var(--sunken); border-radius:14px; padding:9px 13px; min-width:88px}
.fact b{display:block; font-size:16px; font-variant-numeric:tabular-nums}
.fact span{font-size:12px; color:var(--muted)}
.sh-sec h4{margin:0 0 8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:800}
.seasons{display:flex; flex-direction:column; gap:6px}
.season{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 14px; border:1px solid var(--line); border-radius:14px; cursor:pointer; text-align:left; background:transparent; width:100%; transition:all .2s}
.season:hover{border-color:var(--line-strong)}
.season.on{border-color:transparent; background:linear-gradient(var(--surface), var(--surface)) padding-box, var(--grad) border-box}
.season .no{font-weight:800; font-size:13px; color:var(--accent); min-width:2.2ch}
.season .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.season .sm2{font-size:12.5px; color:var(--muted)}
.season .st{font-size:12px; color:var(--muted); white-space:nowrap}
.trackrow{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.trackrow label{color:var(--muted); font-size:14px}
.sh-acts{display:flex; flex-wrap:wrap; gap:8px}
.sh-acts .btn{padding:11px 20px}
.sh-note{font-size:12.5px; color:var(--faint); margin:0}
.sh-have{background:var(--accent-soft); border-radius:14px; padding:11px 14px; font-size:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.set-list{display:flex; flex-direction:column}
.set-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:13px 0; border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lb b{display:block; font-weight:700}
.set-row .lb span{font-size:13px; color:var(--muted)}
.seg{display:flex; background:var(--sunken); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px}
.seg button{border:0; background:none; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:700; color:var(--muted); transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--grad); color:#fff}
.switch{appearance:none; width:46px; height:27px; border-radius:999px; background:var(--line-strong); position:relative; cursor:pointer; margin:0; transition:background .25s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform .3s var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--grad)}
.switch:checked::after{transform:translateX(19px)}
textarea.notes{width:100%; min-height:130px; border:1px solid var(--line-strong); border-radius:14px; padding:12px 14px; background:var(--sunken); color:var(--ink); resize:vertical}
.recs{display:flex; flex-direction:column; gap:6px}
.rec{display:flex; align-items:center; gap:10px; padding:10px 13px; border:1px solid var(--line); border-radius:13px; background:transparent; cursor:pointer; text-align:left; width:100%; transition:all .2s}
.rec:hover{border-color:var(--line-strong); transform:translateX(3px)}
.rec .tx{min-width:0; flex:1}
.rec .t{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rec .m{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* rating mode */
.rate-stars{display:flex; gap:10px; justify-content:center; padding:10px 0}
.rate-stars button{border:0; background:none; color:var(--line-strong); padding:4px; transition:transform .2s var(--ease), color .15s}
.rate-stars button svg{width:46px; height:46px}
.rate-stars:hover button{color:var(--star)}
.rate-stars button:hover ~ button{color:var(--line-strong)}
.rate-stars button:hover{transform:scale(1.18) rotate(-6deg)}
.rate-prog{height:4px; background:var(--sunken); border-radius:4px; overflow:hidden}
.rate-prog i{display:block; height:100%; background:var(--grad); transition:width .4s var(--ease)}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .orbit{position:absolute; right:-60px; top:70px; width:240px; opacity:.55; z-index:-1}
  .hero{position:relative}
}
@media (max-width:680px){
  .wrap{padding-inline:16px}
  .topbar .wrap{height:58px}
  /* a blurred header would trap the fixed bottom nav inside it, so the header goes solid on phones */
  .topbar{backdrop-filter:none; -webkit-backdrop-filter:none; background:color-mix(in srgb, var(--bg) 92%, transparent)}
  .nav{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); margin:0; justify-content:space-around; background:var(--surface); box-shadow:0 14px 40px rgba(0,0,0,.4); z-index:45}
  .nav-btn{flex:1 1 0; min-width:0; flex-direction:column; gap:2px; font-size:11px; padding:7px 4px}
  .nav-btn .badge{position:absolute; top:2px; right:6px}
  .logo{margin-right:auto}
  .dock{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .hero{padding-block:24px 0}
  .stat{min-width:0; flex:1 1 40%}
  .stat b{font-size:22px}
  .row{grid-template-columns:20px minmax(0,1fr) 36px; grid-template-areas:"pick info more" "ctl ctl ctl"; row-gap:10px; padding:12px}
  .ctl{justify-content:flex-start; flex-wrap:wrap}
  .np{white-space:normal}
  .selall{padding-left:4px}
  .search{flex:1 1 100%; order:-1}
  .air{grid-template-columns:52px minmax(0,1fr)}
  .air > :last-child{grid-column:2; justify-self:start}
  .upd{grid-template-columns:1fr}
  .upd .acts{justify-content:flex-start}
  .bar{grid-template-columns:96px minmax(0,1fr) 40px}
  .sheet-wrap{place-items:end center; padding:0}
  .sheet{border-radius:var(--r-xl) var(--r-xl) 0 0; max-height:92vh; padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px))}
  main.wrap{padding-bottom:170px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important} html{scroll-behavior:auto} }

/* =========================================================================
   Clean layer: calmer surfaces, more air, one accent, fewer moving parts.
   ========================================================================= */
.wrap{max-width:1040px; padding-inline:24px}
body{font-size:15px; letter-spacing:-.003em}
.sky{background:radial-gradient(80% 50% at 70% -10%, rgba(74,136,242,.10), transparent 70%), var(--bg)}
.sky canvas{display:none}
.blob{filter:blur(90px)}
.b1,.b3{display:none}

.topbar{background:color-mix(in srgb, var(--bg) 80%, transparent)}
.topbar .wrap{height:68px}
.logo{font-weight:700; font-size:17px; letter-spacing:-.01em}
.nav{background:transparent; border:0; gap:2px}
.nav-btn{font-weight:600; color:var(--muted); padding:8px 14px}
.nav-btn[aria-current="page"]{color:var(--ink)}
.nav-pill{background:var(--glass-2); box-shadow:inset 0 0 0 1px var(--line)}
.gear{background:transparent}

.hero{padding-block:64px 12px}
.hero-grid{gap:48px}
.eyebrow{font-size:11.5px; letter-spacing:.16em}
.eyebrow .jp{background:transparent; border:0; padding:0; color:var(--muted); font-size:12.5px}
h1{font-size:clamp(34px, 4.8vw, 58px); font-weight:700; letter-spacing:-.035em; line-height:1.02; margin-top:18px}
h1 .g{background:none; -webkit-background-clip:initial; background-clip:initial; color:var(--accent); animation:none}
.rise-w{animation-duration:1.1s}
@keyframes wordUp{from{opacity:0; transform:translateY(.35em)}}
.sub{font-size:15.5px; margin-top:18px; line-height:1.6}
.stats{gap:0; margin-top:34px}
.stat{background:none; border:0; border-left:1px solid var(--line); border-radius:0; padding:2px 26px; backdrop-filter:none; min-width:0}
.stat:first-child{border-left:0; padding-left:0}
.stat::before{display:none}
.stat b{font-size:26px; font-weight:700; letter-spacing:-.02em}

/* hero 3D: a quiet stack of the shows you're watching */
.stack{position:relative; height:300px; perspective:1400px; justify-self:stretch}
.stack-inner{position:absolute; inset:0 6% 0 0; transform-style:preserve-3d; transform:rotateX(20deg) rotateY(-18deg) rotateZ(5deg); transition:transform .8s var(--ease); animation:hover3d 9s ease-in-out infinite alternate}
@keyframes hover3d{to{transform:rotateX(16deg) rotateY(-13deg) rotateZ(4deg) translateY(-8px)}}
.slab{position:absolute; left:8%; right:8%; height:96px; border-radius:16px; background:var(--surface); border:1px solid var(--line-strong);
  box-shadow:0 30px 60px rgba(0,0,0,.45); padding:16px 18px; display:flex; flex-direction:column; gap:8px; justify-content:center; backface-visibility:hidden}
.slab .t{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.slab .m{font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:10px}
.slab .pb{height:4px; border-radius:4px; background:var(--sunken); overflow:hidden}
.slab .pb i{display:block; height:100%; background:var(--accent); border-radius:4px}
.slab:nth-child(1){top:12px; transform:translateZ(70px)}
.slab:nth-child(2){top:98px; transform:translateZ(35px); opacity:.85}
.slab:nth-child(3){top:184px; transform:translateZ(0); opacity:.6}

.rail-head{margin:56px 0 16px}
.rail-head h2{font-size:18px; font-weight:700; letter-spacing:-.01em}
.rail{gap:16px; grid-auto-columns:minmax(260px, 290px)}
.tilt{background:var(--surface); backdrop-filter:none; padding:18px; border-color:var(--line)}
.tilt:hover{box-shadow:var(--glow)}
.tilt::after{background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.05), transparent 60%)}
.ring svg circle:last-child{stroke:var(--accent)}

.sky{background:radial-gradient(60% 40% at 70% -8%, rgba(255,255,255,.06), transparent 70%), var(--bg)}
.topbar{background:color-mix(in srgb, var(--bg) 85%, transparent); box-shadow:0 1px 0 rgba(255,255,255,.04)}
h1 .g{background:linear-gradient(180deg, var(--ink) 35%, var(--faint)); -webkit-background-clip:text; background-clip:text; color:transparent}
.row::after{background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.05), transparent 55%)}

/* sharper corners */
.row,.tilt,.add,.upd,.card,.sheet,.tiles .stat{border-radius:12px}
.pc,.tabs,.search,select.sort,.btn,.slab{border-radius:9px}
.tab,.pc-btn,.prog .round,.btn.sm{border-radius:7px}
.air{border-radius:10px}

/* raised surfaces */
.row,.tilt,.add,.upd,.card,.tiles .stat,.slab,.air,.tabs{background:linear-gradient(180deg, color-mix(in srgb, var(--glass-2) 70%, var(--surface)), var(--surface)); box-shadow:var(--bevel), var(--lift); border-color:var(--line)}
.row:hover,.tilt:hover{box-shadow:var(--bevel), 0 0 0 1px var(--line-strong), 0 26px 50px -14px rgba(0,0,0,.95)}
.pc{background:var(--bg); box-shadow:inset 0 2px 6px rgba(0,0,0,.55), inset 0 0 0 1px var(--line)}
.tab[aria-selected="true"]{background:var(--glass-2); box-shadow:var(--bevel), 0 2px 6px rgba(0,0,0,.5)}

/* silver controls with a pressed-in feel */
.btn.primary,.pc-btn.plus,.stepper button.plus,.tilt .stepper button.plus{
  background:linear-gradient(180deg, #ffffff, #c9c9ce); color:var(--on-accent); border-color:transparent;
  box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.18), 0 6px 14px -4px rgba(0,0,0,.8)}
.btn.primary:hover,.pc-btn.plus:hover,.stepper button.plus:hover{background:linear-gradient(180deg, #ffffff, #dedee2)}
.btn.primary:active,.pc-btn.plus:active{transform:translateY(1px); box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.pc-btn,.round,.btn:not(.primary){box-shadow:var(--bevel)}
.badge,.nav-btn:not([aria-current="page"]) .badge{background:var(--ink); color:var(--bg)}
.day h3 .today,.seg button[aria-pressed="true"],.switch:checked,.check:checked,.check:indeterminate,.toast button{background:var(--ink); color:var(--bg)}
.check:checked::after{border-color:var(--bg)}
.nav-pill{background:var(--glass-2); box-shadow:var(--bevel), 0 2px 8px rgba(0,0,0,.6)}
.nav-btn[aria-current="page"] svg{color:var(--ink)}
.pbar i,.bar .tr i,.slab .pb i,.rate-prog i,.un-bar i{background:linear-gradient(90deg, #8e8e96, var(--ink))}
.ring svg circle:last-child{stroke:var(--ink)}
.np-soon{background:var(--accent-soft); color:var(--ink)}
.filters button[aria-pressed="true"],.fill-tg[aria-pressed="true"]{background:var(--accent-soft); color:var(--ink); border-color:var(--line-strong)}
.fill-tg[aria-pressed="true"]::before{background:var(--ink); box-shadow:inset 9px 0 0 2px var(--ink), inset -2px 0 0 2px var(--bg)}
.sg .t mark{color:var(--ink); text-decoration:underline; text-underline-offset:2px}
.ept.seen{color:var(--ink)} .ept.cur{box-shadow:0 0 0 2px var(--ink)}
.season.on{background:var(--accent-soft); border-color:var(--line-strong)}
.add:focus-within{border-color:var(--line-strong); box-shadow:var(--bevel), 0 0 0 3px rgba(255,255,255,.08)}
.air.mine{box-shadow:var(--bevel), inset 3px 0 0 var(--ink)}
:focus-visible{outline-color:var(--ink)}
/* =========================================================================
   Shine layer: outlines that catch the light, soft glow, a little more depth and motion.
   ========================================================================= */
@property --shine{syntax:'<angle>'; inherits:false; initial-value:0deg}
@keyframes shineSpin{to{--shine:360deg}}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-20deg)} 100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes ambient{0%{transform:translate3d(-8vw,-4vh,0)} 50%{transform:translate3d(10vw,6vh,0)} 100%{transform:translate3d(-8vw,-4vh,0)}}
@keyframes riseIn{from{opacity:0; transform:translateY(16px) scale(.985); filter:blur(4px)}}
@keyframes barGlint{0%{transform:translateX(-100%)} 60%,100%{transform:translateX(300%)}}
@keyframes edgePulse{50%{opacity:.55}}

/* moving light in the background */
.sky{overflow:hidden}
.sky::after{content:""; position:absolute; width:70vw; height:60vh; left:30vw; top:-20vh; pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,255,255,.055), transparent); filter:blur(20px); animation:ambient 28s ease-in-out infinite}

/* cards: a 1px outline that brightens where the pointer is */
.row,.tilt{border:1px solid transparent!important;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--glass-2) 70%, var(--surface)), var(--surface)) padding-box,
    radial-gradient(300px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.55), transparent 70%) border-box,
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 40%, rgba(255,255,255,.02)) border-box!important;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease)}
.row{transform:perspective(1400px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.row:hover{transform:perspective(1400px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);
  box-shadow:var(--bevel), 0 0 0 1px rgba(255,255,255,.04), 0 0 40px -6px rgba(255,255,255,.09), 0 30px 60px -18px rgba(0,0,0,.95)}
.tilt:hover{box-shadow:var(--bevel), 0 0 36px -6px rgba(255,255,255,.1), 0 30px 60px -18px rgba(0,0,0,.95)}
.row:not(:hover){--mx:50%; --my:-40%}

/* the hero stack: a slow light that runs around each card's edge */
.slab::before{content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
  background:conic-gradient(from var(--shine), transparent 0 70%, rgba(255,255,255,.75) 82%, transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  animation:shineSpin 6s linear infinite}
.slab:nth-child(2)::before{animation-delay:-2s} .slab:nth-child(3)::before{animation-delay:-4s}
.slab{box-shadow:var(--bevel), 0 0 50px -10px rgba(255,255,255,.12), 0 40px 70px -20px rgba(0,0,0,.95)}

/* number boxes glow a little when you're working them */
.pc{transition:box-shadow .3s var(--ease)}
.pc:focus-within,.pc:hover{box-shadow:inset 0 2px 6px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.22), 0 0 22px -4px rgba(255,255,255,.12)}

/* silver buttons: a glint sweeps across on hover */
.btn.primary,.pc-btn.plus,.stepper button.plus{position:relative; overflow:hidden}
.btn.primary::after,.pc-btn.plus::after,.stepper button.plus::after{content:""; position:absolute; top:0; bottom:0; left:0; width:45%; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); transform:translateX(-120%) skewX(-20deg)}
.btn.primary:hover::after,.pc-btn.plus:hover::after,.stepper button.plus:hover::after{animation:sweep .7s var(--ease)}
.btn.primary:hover,.pc-btn.plus:hover{box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.18), 0 0 20px -2px rgba(255,255,255,.35), 0 6px 14px -4px rgba(0,0,0,.8)}

/* progress bars carry a travelling glint */
.pbar i,.bar .tr i,.slab .pb i{position:relative; overflow:hidden; box-shadow:0 0 10px rgba(255,255,255,.25)}
.pbar i::after,.bar .tr i::after,.slab .pb i::after{content:""; position:absolute; inset:0; width:40%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); animation:barGlint 3.2s ease-in-out infinite}

/* the active tab and nav pill catch light */
.tab[aria-selected="true"],.nav-pill{box-shadow:var(--bevel), 0 0 0 1px rgba(255,255,255,.1), 0 0 18px -4px rgba(255,255,255,.18), 0 2px 8px rgba(0,0,0,.6)}

/* the live dot pulses white */
@keyframes liveW{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.eyebrow .live{background:var(--ink); animation:liveW 2s infinite}

/* page load: hero pieces arrive in order */
.hero .sub,.stats .stat,#orbit,.rail-head,.rail,#add{animation:riseIn .8s var(--ease) backwards}
.hero .sub{animation-delay:.2s}
.stats .stat:nth-child(1){animation-delay:.22s} .stats .stat:nth-child(2){animation-delay:.28s}
.stats .stat:nth-child(3){animation-delay:.34s} .stats .stat:nth-child(4){animation-delay:.4s}
#orbit{animation-delay:.3s} .rail-head{animation-delay:.45s} .rail{animation-delay:.52s} #add{animation-delay:.6s}

@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .row, :root:not([data-theme="dark"]) .tilt{
  background:linear-gradient(180deg, var(--surface), var(--glass-2)) padding-box,
    radial-gradient(300px circle at var(--mx,50%) var(--my,0%), rgba(0,0,0,.45), transparent 70%) border-box,
    linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.06)) border-box!important} }
:root[data-theme="light"] .row,:root[data-theme="light"] .tilt{
  background:linear-gradient(180deg, var(--surface), var(--glass-2)) padding-box,
    radial-gradient(300px circle at var(--mx,50%) var(--my,0%), rgba(0,0,0,.45), transparent 70%) border-box,
    linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.06)) border-box!important}
:root[data-theme="light"] .sky::after{background:radial-gradient(closest-side, rgba(255,255,255,.7), transparent)}</style>

<script>
const $ = s => document.querySelector(s);
const LABEL = {watching:'Watching', finished:'Finished', towatch:'To watch', onhold:'On hold', dropped:'Dropped'};
const PAUSED = s => s === 'onhold' || s === 'dropped';
const ICON = {
  minus:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 8h9"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>',
  more:'<svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg>',
  play:'<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9.5-5.5z"/></svg>',
  star:'<svg width="17" height="17" viewBox="0 0 20 20" fill="currentColor"><path d="m10 1.8 2.5 5.3 5.8.7-4.3 4 1.1 5.7L10 14.7l-5.1 2.8L6 11.8l-4.3-4 5.8-.7z"/></svg>',
  list:'<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="4" height="4" rx="1"/><rect x="6" y="1" width="4" height="4" rx="1" opacity=".45"/><rect x="11" y="1" width="4" height="4" rx="1"/><rect x="1" y="6" width="4" height="4" rx="1" opacity=".45"/><rect x="6" y="6" width="4" height="4" rx="1"/><rect x="11" y="6" width="4" height="4" rx="1"/><rect x="1" y="11" width="4" height="4" rx="1"/><rect x="6" y="11" width="4" height="4" rx="1"/><rect x="11" y="11" width="4" height="4" rx="1" opacity=".45"/></svg>'
};

const NEXT = {airing:'Airing now', soon:'Coming soon', out:'More already out', none:'No sequel announced', done:'Story complete', warn:'Needs checking'};
const VIEWS = ['week', 'updates', 'stats'];
// Genre bits, same order as the catalog builder (_build/build.ps1). Hentai (19) is never offered.
const GENRES = ['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mystery','Psychological','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Thriller','Mecha','Music','Ecchi','Isekai','School','Hentai','Magical Girl','Harem'];
const ADULT = 1 << 19;
// Settings live in the saved list (docMeta.settings) so they follow you to every device
const DEF = {theme:'system', titles:'en', mins:24, compact:false, stars:true, genres:false, weekMine:false, notifySoon:true, fillerBtn:true};
const S = () => ({...DEF, ...(docMeta.settings || {})});
let items = [], docMeta = {}, filt = 'all', tab = 'watching', q = '', sel = new Set(), genre = -1, lastList = 'watching', entering = true;
let sortBy = {watching:'recent', finished:'recent', towatch:'list', onhold:'recent', dropped:'recent'};
let ref = null, canWrite = true, mode = 'loading';
let saveTimer = null, inflight = Promise.resolve(), dirty = false, deferred = false;

try { const t = localStorage.getItem('al-tab'); if (LABEL[t] || VIEWS.includes(t)) tab = t; if (LABEL[t]) lastList = t; Object.assign(sortBy, JSON.parse(localStorage.getItem('al-sort') || '{}')); } catch {}

/* ---------- storage ---------- */
function persist(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); }
function flush(){
  saveTimer = null;
  const body = {...docMeta, items: items.map(x => ({...x}))};
  if (mode === 'local'){ try { localStorage.setItem('al-items', JSON.stringify(body.items)); const m = {...body}; delete m.items; localStorage.setItem('al-meta', JSON.stringify(m)); } catch {} dirty = false; return; }
  if (mode !== 'db') return;

let SCHED = null, schedLoading = null;
function loadSchedule(){

    .catch(err => { schedLoading = null; throw err; });
  return schedLoading;
}

      .catch(() => box.innerHTML = '<div class="empty"><b>Couldn’t load the schedule</b>Reload the page to try again. It is refreshed every Sunday night.</div>');

  }).filter(r => r.at >= start && r.at < start + 7 * 86400 && !(r.g & ADULT));
  const shown = mineOnly ? rows.filter(r => r.it) : rows;

  const days = [...Array(7)].map((_, d) => ({d, list: shown.filter(r => Math.floor((r.at - start) / 86400) === d).sort((a, b) => a.at - b.at)}));

/* ---------- stats ---------- */
function watchedEps(x){
  const ss = x.cat?.ss;
  if (x.status === 'finished') return (x.total || (ss ? ss.reduce((a, s) => a + s[0], 0) : 0)) * (1 + (x.rewatch || 0));
  if (x.status === 'watching' || PAUSED(x.status)){
    const before = ss ? ss.slice(0, (x.season || 1) - 1).reduce((a, s) => a + s[0], 0) : 0;
    return before + (x.episode || 0);
  }
  return 0;
}
function bars(rows, total){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(([l, v]) => `<div class="bar" title="${esc(l)}: ${v}"><span class="lb">${esc(l)}</span><span class="tr"><i style="width:${v / max * 100}%"></i></span><span class="vl">${v}</span></div>`).join('')}</div>`;
}
function renderStats(){
  const box = $('#view-stats');
  if (!CAT){ loadCatalog().then(() => { if (tab === 'stats') renderStats(); }).catch(() => {}); }
  const fin = items.filter(x => x.status === 'finished'), wat = items.filter(x => x.status === 'watching');
  const eps = items.reduce((a, x) => a + watchedEps(x), 0);
  const rated = items.filter(x => x.rating), avg = rated.length ? rated.reduce((a, x) => a + x.rating, 0) / rated.length : 0;
  const gc = new Array(GENRES.length).fill(0);
  [...fin, ...wat].forEach(x => { const g = catOf(x)?.g || 0; GENRES.forEach((n, b) => { if (b !== 19 && (g & (1 << b))) gc[b]++; }); });
  const topG = GENRES.map((n, b) => [n, gc[b]]).filter(r => r[1]).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const rateRows = [5, 4, 3, 2, 1].map(n => ['★'.repeat(n), items.filter(x => x.rating === n).length]);
  const months = [];
  for (let k = 5; k >= 0; k--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - k); months.push([d.toLocaleDateString(undefined, {month:'short', year:'2-digit'}), d.getFullYear(), d.getMonth()]); }
  const perMonth = months.map(([l, y, m]) => [l, fin.filter(x => x.finishedAt && new Date(x.finishedAt).getFullYear() === y && new Date(x.finishedAt).getMonth() === m).length]);
  const hasMonths = perMonth.some(r => r[1]);
  box.innerHTML = `

      <div class="stat"><b>${items.reduce((a, x) => a + (x.rewatch || 0), 0)}</b><span>Rewatches</span></div>
    </div>
    <div class="cols">
      <div class="card"><div class="sec-head" style="margin-bottom:12px"><h2 style="font-size:16px">Top genres</h2><p>Watching + finished</p></div>${topG.length ? bars(topG) : '<p class="note">Genres appear once the catalog has loaded.</p>'}</div>
      <div class="card"><div class="sec-head" style="margin-bottom:12px"><h2 style="font-size:16px">Your ratings</h2><p>${items.length - rated.length} not rated yet</p></div>${bars(rateRows)}</div>
      <div class="card"><div class="sec-head" style="margin-bottom:12px"><h2 style="font-size:16px">Finished per month</h2><p>Last 6 months</p></div>${hasMonths ? bars(perMonth) : '<p class="note" style="text-align:left">Shows you mark finished from now on are counted here by month.</p>'}</div>

/* ---------- anime catalog search ---------- */
// catalog.json rows: [title, type T/M/O/V, episodes, status F/A/U/?, year*10+quarter, franchise id, score*10, MAL id, "syn|syn", minutes per ep]
const TYPE = {T:'TV', M:'Movie', O:'Web', V:'OVA'}, STAT = {F:'Finished', A:'Airing now', U:'Upcoming', '?':'Status unknown'};
let CAT = null, HAY = null, FR = null, CATV = '', catLoading = null;
const normS = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function loadCatalog(){
  if (!catLoading) catLoading = fetch('catalog.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
    CAT = j.a.map((r, idx) => ({t:r[0], ty:r[1], e:r[2], s:r[3], yq:r[4], fr:r[5], sc:r[6], mal:r[7], syn:r[8] ? r[8].split('|') : [], dur:r[9], g:r[10] || 0, en:r[11] || '', idx}));
    HAY = CAT.map(c => [c.t, ...c.syn].map(normS));
    FR = new Map(); CAT.forEach((c, i) => { if (!FR.has(c.fr)) FR.set(c.fr, []); FR.get(c.fr).push(i); });
    MALIDX = new Map(); CAT.forEach((c, i) => { if (c.mal) MALIDX.set(c.mal, i); });
    CATV = j.v;
  }).catch(err => { catLoading = null; throw err; });
  return catLoading;
}
const yearOf = yq => yq ? Math.floor(yq / 10) : null;
function seasonsOf(i){
  const c = CAT[i], all = FR.get(c.fr).map(k => CAT[k]);
  let tv = all.filter(x => x.ty === 'T' && (x.dur === 0 || x.dur >= 15) && (x.e > 0 || x.s !== 'F'));
  if (tv.some(x => x.mal)) tv = tv.filter(x => x.mal);
  if (!tv.length && c.ty === 'O') tv = all.filter(x => x.ty === 'O' && x.e > 0 && x.mal);
  if (!tv.includes(c) && c.ty !== 'T' && c.ty !== 'O') tv = [c];        // a film or OVA stands on its own
  if (!tv.length) tv = [c];
  tv.sort((a, b) => (a.yq || 99999) - (b.yq || 99999));
  return {tv, films: all.filter(x => x.ty === 'M' && !tv.includes(x)).length};
}
const looksEnglish = s => /^[\x20-\x7E]+$/.test(s)
  && /\b(the|of|on|in|to|my|is|and|with|love|world|girl|boy|life|another|from|season|part|final|movie|you|your|who)\b/i.test(s)
  && !/\b(los|las|el|del|temporada|saison|des|le|la|les|die|der|das|und|staffel|di|il|de|na|wa|ni|wo|ga|no|ka|kara|sezon|stagione|sinu|nimi|ja|ei|och|og|dla|nie|una|uno|um|uma|ein|eine|du)\b/i.test(s);
// The name English speakers use. A plain-Latin main title ("Jujutsu Kaisen", "Spy x Family") is kept;
// otherwise the shortest multi-word alternative title that isn't Japanese, another language or an abbreviation ("Demon Slayer").
const JP_WORDS = /\b(no|wa|ga|wo|ni|de|to|mo|ka|na|kara|made|yo|ne|desu|suru|shite|shitara|datta|naru|nai|kun|chan|san)\b/i;

function names(i, k){

  // in search, show the English name when it contains what you typed, otherwise the name that matched
  const qt = normS($('#add-title')?.value || '').split(' ').filter(Boolean);
  const shown = k > 0 && !(en && qt.length && qt.every(t => normS(en).includes(t))) ? all[k] : (en || c.t);

let GFREQ = null;
// Recommendations: genres weighted by what you rated and watch, plus the show's score. seed = genre bits for "similar to"
function recommend(n, seed, skipFr){
  if (!CAT) return [];
  const w = new Array(GENRES.length).fill(0), mine = new Set();
  if (seed) GENRES.forEach((x, b) => { if (seed & (1 << b)) w[b] = 1; });
  items.forEach(x => {
    const c = catOf(x); if (!c) return;
    mine.add(c.fr);
    if (seed) return;
    const wt = x.rating ? [-1, -0.5, 0.5, 1.5, 3][x.rating - 1] : x.status === 'watching' ? 1.5 : x.status === 'finished' ? 1 : x.status === 'dropped' ? -1 : 0.5;
    GENRES.forEach((g, b) => { if (c.g & (1 << b)) w[b] += wt; });
  });
  w[19] = -99;                                               // never recommend adult titles
  // common genres (comedy, drama) say less about taste than rare ones, so weight by rarity
  if (!GFREQ){ GFREQ = new Array(GENRES.length).fill(1); CAT.forEach(c => { for (let b = 0; b < GENRES.length; b++) if (c.g & (1 << b)) GFREQ[b]++; }); }
  const best = new Map();
  const sequel = /\b(2nd|3rd|\d+th|season|ii|iii|iv|part|second|third|final|movie|film|recap|special)\b/i;
  for (const c of CAT){
    if (!c.mal || c.g & ADULT || c.s !== 'F' || c.sc < 72 || !c.g || (c.ty !== 'T' && c.ty !== 'M') || mine.has(c.fr) || c.fr === skipFr || sequel.test(c.t)) continue;
    let sim = 0, bits = 0;
    for (let b = 0; b < GENRES.length; b++) if (c.g & (1 << b)){ sim += w[b] / Math.sqrt(GFREQ[b] / 1000); bits++; }
    if (sim <= 0) continue;
    const s = sim / Math.sqrt(bits + 1);

    if (!cur || c.sc > CAT[cur.i].sc) best.set(c.fr, {i: c.idx, sim: s});

  const all = [...best.values()], max = Math.max(1e-9, ...all.map(r => r.sim));
  all.forEach(r => r.v = 0.65 * r.sim / max + 0.35 * (CAT[r.i].sc - 70) / 30);
  return all.sort((a, b) => b.v - a.v).slice(0, n).map(r => {
    const first = seasonsOf(r.i).tv[0], c = CAT[first.idx];
    const score = g => { const b = GENRES.indexOf(g); return w[b] / Math.sqrt(GFREQ[b]); };
    const shared = GENRES.filter((g, b) => b !== 19 && (c.g & (1 << b)) && w[b] > 0).sort((a, b) => score(b) - score(a)).slice(0, 2);

}
function recRow(r, attr){

  const meta = [r.why.length ? r.why.join(', ') : '', yearOf(c.yq), ss.length > 1 ? ss.length + ' seasons' : TYPE[c.ty], c.sc ? '★ ' + (c.sc / 10).toFixed(1) : ''].filter(Boolean).join(' · ');
  return `<button class="rec" ${attr}="${r.i}"><div class="tx"><div class="t">${esc(nm.shown)}</div><div class="m">${esc(meta)}</div></div><span style="color:var(--faint)">›</span></button>`;
}
function searchCat(q){
  const nq = normS(q); if (!nq || !CAT) return [];
  const toks = nq.split(' '), best = new Map();
  for (let i = 0; i < CAT.length; i++){
    const hs = HAY[i]; let s = -1, kk = 0;
    for (let k = 0; k < hs.length; k++){
      const h = hs[k];
      if (!toks.every(t => h.includes(t))) continue;
      let v = h === nq ? 1000 : h.startsWith(nq) ? 800 : (' ' + h).includes(' ' + nq) ? 600 : (' ' + h).includes(' ' + toks[0]) ? 450 : 250;
      v -= Math.min(h.length, 90) / 3;
      if (v > s){ s = v; kk = k; }
    }
    if (s < 0) continue;
    const c = CAT[i];
    s += (c.ty === 'T' ? 60 : c.ty === 'M' ? 20 : 0) + (c.sc || 0) / 2 + (c.mal ? 0 : -200) - (c.yq ? 0 : 40);
    const cur = best.get(c.fr);
    if (!cur || s > cur.s) best.set(c.fr, {i, s, k: kk});

  const seenNames = new Set(), top = [];

    if (seenNames.has(n)) continue;

    if ((c.s === 'U' || !c.e) && [...seenNames].some(p => n.startsWith(p + ' '))) continue;

  }
  // show each franchise by its first season unless the search names a specific season
  if (!/\d|season|part|final|movie|film/.test(nq)) for (const r of top){
    if (CAT[r.i].ty !== 'T' && CAT[r.i].ty !== 'O') continue;
    const fi = seasonsOf(r.i).tv[0].idx;
    if (fi !== r.i){ r.i = fi; r.k = Math.max(0, HAY[fi].findIndex(h => toks.every(t => h.includes(t)))); }
  }
  return top;
}
function mark(text, q){

let pick = null;

$('#sheet-wrap').addEventListener('click', e => {

function addFromCatalog(status){
  const p = pick, ss = p.ss, cur = ss[p.sel];
  const it = {id: newId(), title: p.name, status, added: Date.now(), updated: Date.now(),
    cat: {mal: CAT[p.i].mal, ss: ss.map(s => [s.e, s.s, s.yq])}};
  const sum = ss.reduce((a, s) => a + s.e, 0);
  if (status === 'watching'){
    if (ss.length > 1) it.season = p.sel + 1;
    it.episode = num($('#sh-ep').value) ?? 0;
    if (cur?.e) it.total = cur.e;
  } else {
    if (sum) it.total = sum;
    if (status === 'finished'){ it.finishedAt = Date.now(); if (ss.length > 1) it.season = ss.length; }
  }
  const nx = nextFromCat(it); if (nx) it.next = nx;
  closeSheet(); closeSugg(true);
  withUndo(`Added ${it.title} to ${LABEL[status]}`, () => items.push(it));
  jumpTo(it);
}

  const f = e.target.dataset.f; if (!f) return;
  const id = e.target.closest('[data-id]').dataset.id, it = byId(id);
  if (f === 'title'){
    const t = e.target.value.trim();
    if (!t){ e.target.value = displayTitle(it); return; }
    set(id, S().titles === 'jp' ? {jp: t} : {title: t});
  } else {
    let n = num(e.target.value);
    if (f === 'episode' && e.target.dataset.canon && n != null){ const fl = canonMode(it); if (fl) n = nthCanon(fl, n); }   // "canon episode n" -> real episode number
    const patch = {[f]: (f === 'season' || f === 'total') && n === 0 ? null : n};
    if (f === 'season' && n && it.cat?.ss?.[n - 1]) patch.total = it.cat.ss[n - 1][0] || null;
    set(id, patch);
    if (it.cat && f === 'season'){ refreshNext(it); persist(); render(); }
  }
});
list.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[data-f]')) e.target.blur();
  if (e.key === 'Escape' && e.target.matches('input[data-f]')){ const it = byId(e.target.closest('[data-id]').dataset.id); e.target.value = it[e.target.dataset.f] ?? ''; e.target.blur(); }
});
list.addEventListener('focusout', () => setTimeout(() => { if (deferred) render(); }, 0));

$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.bclear !== undefined){ sel.clear(); render(); return; }
  const n = sel.size, ids = [...sel];
  if (b.dataset.bmove){ const to = b.dataset.bmove; withUndo(`Moved ${n} to ${LABEL[to]}`, () => { ids.forEach(id => moveTo(byId(id), to)); sel.clear(); }); }
  else if (b.dataset.bdel !== undefined){ withUndo(`Deleted ${n} show${n > 1 ? 's' : ''}`, () => { items = items.filter(x => !sel.has(x.id)); sel.clear(); }); }
});

document.addEventListener('keydown', e => {
  const typing = e.target.matches('input, select, textarea');
  if (e.key === 'Escape'){
    if (!$('#menu').hidden){ closeMenu(); return; }
    if (e.target.id === 'search' && q){ e.target.value = ''; q = ''; render(); return; }
    if (sel.size && !typing){ sel.clear(); render(); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/' || e.key === 'n'){ e.preventDefault(); $('#add-title').focus(); }
  else if (e.key === 'f'){ e.preventDefault(); $('#search').focus(); }
  else if (/^[1-8]$/.test(e.key)) goTab(['watching','finished','towatch','onhold','dropped','week','updates','stats'][+e.key - 1]);
});

render();
// load the catalog in the background so genres, Japanese titles and stats are ready
setTimeout(() => Promise.all([loadCatalog(), loadSchedule().catch(() => {}), loadFillers()]).then(() => render()).catch(() => {}), 400);
</script>
